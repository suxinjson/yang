name: 自动构建与部署

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    name: 编译打包与远程发布
    runs-on: ubuntu-24.04
    steps:
    - name: 1. 拉取源码
      uses: actions/checkout@v4

    - name: 2. 安装 Node.js 环境
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: 3. 安装依赖与前端构建
      run: |
        npm ci
        npm run build

    - name: 4. 准备部署压缩包
      run: |
        mkdir -p deploy_bundle
        # 打包生产运行必需的精简产物
        cp -r dist public shared server.js deploy Dockerfile compose.yaml package.json deploy_bundle/
        tar -czf "update-bundle.tar.gz" -C deploy_bundle .

    - name: 5. 远程 SSH 部署到服务器
      env:
        SERVER_HOST: ${{ secrets.SERVER_HOST }}
        SERVER_USER: ${{ secrets.SERVER_USER }}
        SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
        SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        SERVER_DEPLOY_PATH: ${{ secrets.SERVER_DEPLOY_PATH || '~/ganglegang' }}
      run: |
        set -euo pipefail

        echo ">>> [1/4] 验证 GitHub Secrets 部署凭据配置..."
        MISSING_SECRETS=""
        if [ -z "${SERVER_HOST:-}" ]; then MISSING_SECRETS="${MISSING_SECRETS} SERVER_HOST"; fi
        if [ -z "${SERVER_USER:-}" ]; then MISSING_SECRETS="${MISSING_SECRETS} SERVER_USER"; fi
        if [ -z "${SERVER_SSH_KEY:-}" ]; then MISSING_SECRETS="${MISSING_SECRETS} SERVER_SSH_KEY"; fi

        if [ -n "$MISSING_SECRETS" ]; then
          echo "::error::缺少必需的 GitHub Actions Secrets 配置！"
          echo "=========================================================================="
          echo "❌ 远程部署失败：以下 Secrets 未在 GitHub 仓库中配置："
          for s in $MISSING_SECRETS; do
            echo "   - $s"
          done
          echo ""
          echo "👉 请前往 GitHub 仓库设置页面添加这些 Secrets："
          echo "   https://github.com/${{ github.repository }}/settings/secrets/actions"
          echo ""
          echo "说明清单："
          echo "   - SERVER_HOST:        服务器公网 IP 或域名 (如 123.45.67.89)"
          echo "   - SERVER_USER:        SSH 登录用户名 (如 root 或 ubuntu)"
          echo "   - SERVER_SSH_KEY:     SSH 私钥内容 (包含 -----BEGIN ... ----- 和 -----END ... -----)"
          echo "   - SERVER_PORT:        (可选) SSH 端口号，默认 22"
          echo "   - SERVER_DEPLOY_PATH: (可选) 服务器部署目录，默认 ~/ganglegang"
          echo "=========================================================================="
          exit 1
        fi

        echo ">>> [2/4] 配置 SSH 密钥与主机指纹..."
        SSH_KEY_PATH="$RUNNER_TEMP/deploy_id_ed25519"
        printf '%s\n' "$SERVER_SSH_KEY" > "$SSH_KEY_PATH"
        # 确保私钥文件末尾有正确的换行符
        sed -i -e '$a\' "$SSH_KEY_PATH"
        chmod 600 "$SSH_KEY_PATH"

        KNOWN_HOSTS_PATH="$RUNNER_TEMP/known_hosts"
        if [ -n "${SERVER_KNOWN_HOSTS:-}" ]; then
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > "$KNOWN_HOSTS_PATH"
        else
          echo "未指定 SERVER_KNOWN_HOSTS，正在自动获取服务器公钥指纹..."
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" > "$KNOWN_HOSTS_PATH" 2>/dev/null || true
        fi
        chmod 600 "$KNOWN_HOSTS_PATH"

        SSH_OPTS=(-i "$SSH_KEY_PATH" -p "$SERVER_PORT" -o StrictHostKeyChecking=accept-new -o "UserKnownHostsFile=$KNOWN_HOSTS_PATH" -o ConnectTimeout=15)
        SCP_OPTS=(-i "$SSH_KEY_PATH" -P "$SERVER_PORT" -o StrictHostKeyChecking=accept-new -o "UserKnownHostsFile=$KNOWN_HOSTS_PATH" -o ConnectTimeout=15)
        REMOTE_TAR="/tmp/update-${GITHUB_RUN_ID}.tar.gz"
        REMOTE_SCRIPT="/tmp/install-${GITHUB_RUN_ID}.sh"

        echo ">>> [3/4] 上传升级包与安装脚本至服务器..."
        if ! scp "${SCP_OPTS[@]}" "update-bundle.tar.gz" "$SERVER_USER@$SERVER_HOST:$REMOTE_TAR"; then
          echo "::error::SCP 上传失败！请检查服务器 IP、SSH 端口、用户名与密钥授权（~/.ssh/authorized_keys）。"
          exit 1
        fi
        scp "${SCP_OPTS[@]}" "deploy/install-update.sh" "$SERVER_USER@$SERVER_HOST:$REMOTE_SCRIPT"

        echo ">>> [4/4] 触发加锁安装与健康探测..."
        ssh "${SSH_OPTS[@]}" "$SERVER_USER@$SERVER_HOST" "bash $REMOTE_SCRIPT $SERVER_DEPLOY_PATH $REMOTE_TAR"

        # 清理远程临时文件
        ssh "${SSH_OPTS[@]}" "$SERVER_USER@$SERVER_HOST" "rm -f $REMOTE_TAR $REMOTE_SCRIPT"

    - name: 6. 清理临时凭据
      if: ${{ always() }}
      run: rm -f "$RUNNER_TEMP/deploy_id_ed25519" "$RUNNER_TEMP/known_hosts"
