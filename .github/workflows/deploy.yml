name: 自动构建与部署

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  android:
    name: 构建 Android 更新包
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - name: 构建前端与原生工程
      run: |
        npm ci
        npm run build:android
    - name: 签名并输出 APK
      env:
        YANG_ANDROID_KEYSTORE: ${{ secrets.YANG_ANDROID_KEYSTORE_BASE64 }}
        YANG_ANDROID_STORE_PASSWORD: ${{ secrets.YANG_ANDROID_STORE_PASSWORD }}
        YANG_ANDROID_KEY_PASSWORD: ${{ secrets.YANG_ANDROID_KEY_PASSWORD }}
        YANG_ANDROID_KEY_ALIAS: ${{ secrets.YANG_ANDROID_KEY_ALIAS }}
      run: |
        MISSING_SIGNING=""
        if [ -z "$YANG_ANDROID_KEYSTORE" ]; then MISSING_SIGNING="$MISSING_SIGNING YANG_ANDROID_KEYSTORE_BASE64"; fi
        if [ -z "$YANG_ANDROID_STORE_PASSWORD" ]; then MISSING_SIGNING="$MISSING_SIGNING YANG_ANDROID_STORE_PASSWORD"; fi
        if [ -z "$YANG_ANDROID_KEY_PASSWORD" ]; then MISSING_SIGNING="$MISSING_SIGNING YANG_ANDROID_KEY_PASSWORD"; fi
        if [ -z "$YANG_ANDROID_KEY_ALIAS" ]; then MISSING_SIGNING="$MISSING_SIGNING YANG_ANDROID_KEY_ALIAS"; fi
        if [ -n "$MISSING_SIGNING" ]; then
          echo "::error::缺少必需的 Android 签名 Secrets: $MISSING_SIGNING"
          exit 1
        fi
        printf '%s' "$YANG_ANDROID_KEYSTORE" | tr -d '\r\n ' | base64 -d > release.jks || {
          echo "::error::Base64 解码 release.jks 失败，请确认 YANG_ANDROID_KEYSTORE_BASE64 有效"
          exit 1
        }
        if [ ! -s release.jks ]; then
          echo "::error::解码生成的 release.jks 文件大小为 0，请检查 Secret 内容"
          exit 1
        fi
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true
        sed -i -e 's/\r$//' ./android/gradlew
        chmod +x ./android/gradlew
        if grep -q "git-lfs" ./android/gradle/wrapper/gradle-wrapper.jar 2>/dev/null; then
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.11.1/gradle/wrapper/gradle-wrapper.jar -o ./android/gradle/wrapper/gradle-wrapper.jar
        fi
        export YANG_ANDROID_KEYSTORE="$PWD/release.jks"
        set -o pipefail
        if ! ./android/gradlew -p android assembleRelease --console=plain --stacktrace 2>&1 | tee /tmp/gradle.log; then
          echo "### ❌ Gradle 打包失败日志" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -n 80 /tmp/gradle.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          LAST_ERR=$(grep -m 1 -E '(FAILURE|FAILED|Execution failed|What went wrong)' /tmp/gradle.log || tail -n 1 /tmp/gradle.log)
          echo "::error title=Gradle Error::$LAST_ERR"
          exit 1
        fi
        mkdir -p artifacts/android-release
        node scripts/android-release.mjs manifest android/app/build/outputs/apk/release/app-release.apk artifacts/android-release
    - uses: actions/upload-artifact@v4
      with:
        name: ganglegang-android-release
        path: artifacts/android-release

  deploy:
    name: 编译打包与远程发布
    needs: android
    runs-on: ubuntu-24.04
    steps:
    - name: 1. 拉取源码
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: 2. 安装 Node.js 环境
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: 3. 安装依赖与前端构建
      run: |
        npm ci
        npm run build

    - name: 运行发布回归检查 (数据模型与存储迁移)
      env:
        PG_DUMP_BIN: ${{ runner.temp }}/pg_dump17
      run: |
        docker pull postgres:17-alpine
        cat > "$PG_DUMP_BIN" <<'SH'
        #!/usr/bin/env bash
        exec docker run --rm --network host -e PGHOST -e PGPORT -e PGDATABASE -e PGUSER -e PGPASSWORD -v "$BACKUP_DIR:$BACKUP_DIR" postgres:17-alpine pg_dump "$@"
        SH
        chmod +x "$PG_DUMP_BIN"
        npm run test:inventory

    - name: 4. 下载 Android 构建产物
      uses: actions/download-artifact@v4
      with:
        name: ganglegang-android-release
        path: artifacts/android-release

    - name: 5. 准备部署压缩包
      run: |
        mkdir -p deploy_bundle
        # 打包生产运行必需的精简产物
        cp -r dist public shared server.js deploy scripts Dockerfile compose.yaml package.json package-lock.json deploy_bundle/
        if [ -d artifacts/android-release ]; then mkdir -p deploy_bundle/app-releases; cp artifacts/android-release/* deploy_bundle/app-releases/; fi
        tar -czf "update-bundle.tar.gz" -C deploy_bundle .

    - name: 6. 远程 SSH 部署到服务器
      env:
        SERVER_HOST: ${{ secrets.SERVER_HOST }}
        SERVER_USER: ${{ secrets.SERVER_USER }}
        SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
        SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        SERVER_DEPLOY_PATH: ${{ secrets.SERVER_DEPLOY_PATH || '~/ganglegang' }}
        GANG_DATABASE_PASSWORD: ${{ secrets.GANG_DATABASE_PASSWORD }}
        ADMIN_INITIAL_PASSWORD: ${{ secrets.ADMIN_INITIAL_PASSWORD }}
        GANG_DATABASE_NETWORK: ${{ secrets.GANG_DATABASE_NETWORK || 'member_private' }}
        GANG_DATABASE_USER: ${{ secrets.GANG_DATABASE_USER || 'ganglegang_app' }}
        GANG_DATABASE_NAME: ${{ secrets.GANG_DATABASE_NAME || 'ganglegang' }}
        POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || '' }}
      run: |
        set -euo pipefail

        echo ">>> [1/4] 验证 GitHub Secrets 部署凭据配置..."
        MISSING_SECRETS=""
        if [ -z "${SERVER_HOST:-}" ]; then MISSING_SECRETS="${MISSING_SECRETS} SERVER_HOST"; fi
        if [ -z "${SERVER_USER:-}" ]; then MISSING_SECRETS="${MISSING_SECRETS} SERVER_USER"; fi
        if [ -z "${SERVER_SSH_KEY:-}" ]; then MISSING_SECRETS="${MISSING_SECRETS} SERVER_SSH_KEY"; fi
        if [ -z "${GANG_DATABASE_PASSWORD:-}" ]; then MISSING_SECRETS="${MISSING_SECRETS} GANG_DATABASE_PASSWORD"; fi

        if [ -n "$MISSING_SECRETS" ]; then
          echo "::error::缺少必需的 GitHub Actions Secrets 配置！"
          echo "=========================================================================="
          echo "❌ 远程部署失败：以下 Secrets 未在 GitHub 仓库中配置："
          for s in $MISSING_SECRETS; do
            echo "   - $s"
          done
          echo ""
          echo "👉 请前往 GitHub 仓库设置页面添加这些 Secrets："
          echo "   https://github.com/${{ github.repository }}/settings/secrets/actions"
          echo ""
          echo "说明清单："
          echo "   - SERVER_HOST:            服务器公网 IP 或域名 (如 123.45.67.89)"
          echo "   - SERVER_USER:            SSH 登录用户名 (如 root 或 ubuntu)"
          echo "   - SERVER_SSH_KEY:         SSH 私钥内容 (包含 -----BEGIN ... ----- 和 -----END ... -----)"
          echo "   - GANG_DATABASE_PASSWORD: 生产环境 PostgreSQL 数据库专用连接密码"
          echo "   - SERVER_PORT:            (可选) SSH 端口号，默认 22"
          echo "   - SERVER_DEPLOY_PATH:     (可选) 服务器部署目录，默认 ~/ganglegang"
          echo "=========================================================================="
          exit 1
        fi

        echo ">>> [2/4] 配置 SSH 密钥与主机指纹..."
        SSH_KEY_PATH="$RUNNER_TEMP/deploy_id_ed25519"
        printf '%s\n' "$SERVER_SSH_KEY" > "$SSH_KEY_PATH"
        # 确保私钥文件末尾有正确的换行符
        sed -i -e '$a\' "$SSH_KEY_PATH"
        chmod 600 "$SSH_KEY_PATH"

        KNOWN_HOSTS_PATH="$RUNNER_TEMP/known_hosts"
        if [ -n "${SERVER_KNOWN_HOSTS:-}" ]; then
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > "$KNOWN_HOSTS_PATH"
        else
          echo "未指定 SERVER_KNOWN_HOSTS，正在自动获取服务器公钥指纹..."
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" > "$KNOWN_HOSTS_PATH" 2>/dev/null || true
        fi
        chmod 600 "$KNOWN_HOSTS_PATH"

        SSH_OPTS=(-i "$SSH_KEY_PATH" -p "$SERVER_PORT" -o StrictHostKeyChecking=accept-new -o "UserKnownHostsFile=$KNOWN_HOSTS_PATH" -o ConnectTimeout=15)
        SCP_OPTS=(-i "$SSH_KEY_PATH" -P "$SERVER_PORT" -o StrictHostKeyChecking=accept-new -o "UserKnownHostsFile=$KNOWN_HOSTS_PATH" -o ConnectTimeout=15)
        REMOTE_TAR="/tmp/update-${GITHUB_RUN_ID}.tar.gz"
        REMOTE_SCRIPT="/tmp/install-${GITHUB_RUN_ID}.sh"
        REMOTE_ENV="/tmp/env-${GITHUB_RUN_ID}"

        echo ">>> [3/4] 上传升级包、安装脚本与数据库凭据至服务器..."
        if ! scp "${SCP_OPTS[@]}" "update-bundle.tar.gz" "$SERVER_USER@$SERVER_HOST:$REMOTE_TAR"; then
          echo "::error::SCP 上传失败！请检查服务器 IP、SSH 端口、用户名与密钥授权（~/.ssh/authorized_keys）。"
          exit 1
        fi
        scp "${SCP_OPTS[@]}" "deploy/install-update.sh" "$SERVER_USER@$SERVER_HOST:$REMOTE_SCRIPT"

        # 生成用于生产环境的数据库与存储驱动环境变量文件
        ENV_DEPLOY_PATH="$RUNNER_TEMP/.env.deploy"
        {
          echo "PORT=3000"
          echo "STORAGE_DRIVER=postgres"
          echo "PGHOST=db"
          echo "PGPORT=5432"
          echo "PGDATABASE=${GANG_DATABASE_NAME}"
          echo "PGUSER=${GANG_DATABASE_USER}"
          echo "PGPASSWORD=${GANG_DATABASE_PASSWORD}"
          echo "GANG_DATABASE_NAME=${GANG_DATABASE_NAME}"
          echo "GANG_DATABASE_USER=${GANG_DATABASE_USER}"
          echo "GANG_DATABASE_PASSWORD=${GANG_DATABASE_PASSWORD}"
          echo "GANG_DATABASE_NETWORK=${GANG_DATABASE_NETWORK}"
          echo "ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD}"
          if [ -n "${POSTGRES_PASSWORD:-}" ]; then
            echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
          fi
        } > "$ENV_DEPLOY_PATH"
        chmod 600 "$ENV_DEPLOY_PATH"
        scp "${SCP_OPTS[@]}" "$ENV_DEPLOY_PATH" "$SERVER_USER@$SERVER_HOST:$REMOTE_ENV"
        rm -f "$ENV_DEPLOY_PATH"

        echo ">>> [4/4] 触发加锁安装与健康探测..."
        ssh "${SSH_OPTS[@]}" "$SERVER_USER@$SERVER_HOST" "bash $REMOTE_SCRIPT $SERVER_DEPLOY_PATH $REMOTE_TAR $REMOTE_ENV"

        # 清理远程临时文件
        ssh "${SSH_OPTS[@]}" "$SERVER_USER@$SERVER_HOST" "rm -f $REMOTE_TAR $REMOTE_SCRIPT $REMOTE_ENV"

    - name: 7. 清理临时凭据
      if: ${{ always() }}
      run: rm -f "$RUNNER_TEMP/deploy_id_ed25519" "$RUNNER_TEMP/known_hosts" "$RUNNER_TEMP/.env.deploy"
