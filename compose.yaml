services:
  ganglegang:
    build: .
    container_name: ganglegang
    restart: unless-stopped
    ports:
      # 仅绑定本地 127.0.0.1，公网流量通过 Caddy 443 HTTPS 安全反代接入
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=3000
      - STORAGE_DRIVER=postgres
      - PGHOST=db
      - PGPORT=5432
      - PGDATABASE=${GANG_DATABASE_NAME:-ganglegang}
      - PGUSER=${GANG_DATABASE_USER:-ganglegang_app}
      - PGPASSWORD=${GANG_DATABASE_PASSWORD:?请配置游戏数据库专用密码}
    networks:
      - member_private

networks:
  member_private:
    external: true
    name: ${GANG_DATABASE_NETWORK:-member_private}
